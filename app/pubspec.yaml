name: barter_app
description: "BarterApp — cash-free trading for farms, workshops and individuals."
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: ^3.12.2

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  flutter_web_plugins:
    sdk: flutter

  # Routing that gives web real URLs and mobile a real back stack.
  go_router: ^17.0.0

  # State and dependency injection.
  flutter_riverpod: ^3.0.3

  # Networking.
  dio: ^5.9.0

  # Number, date and currency formatting per locale.
  intl: any

  # One socket for live messages, typing and offer updates.
  web_socket_channel: ^3.0.3

  cached_network_image: ^3.4.1
  shared_preferences: ^2.5.4
  flutter_animate: ^4.5.2
  animations: ^2.2.0
  material_symbols_icons: ^4.2960.0
  image_picker: ^1.2.3
  genkit: ^0.15.1
  http: ^1.6.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

  # Lets a test run the clock forward without waiting. The live socket backs
  # off for up to thirty seconds between retries; asserting on that behaviour
  # in real time would mean a test suite that takes a minute to say yes.
  fake_async: ^1.3.3

flutter:
  uses-material-design: true
  generate: true

  # Bundled, not fetched. `google_fonts` downloads a family on first use and
  # caches it, which means the first launch on a slow connection renders in a
  # fallback face — and on no connection, always. Half this marketplace opens
  # the app on rural mobile data, so the type ships with the binary.
  #
  # Both are variable fonts with a single weight axis: one file covers 300–900,
  # and both carry the full Cyrillic block, which is what the previous face was
  # missing.
  fonts:
    - family: Rubik
      fonts:
        - asset: assets/fonts/Rubik-Variable.ttf
    - family: Manrope
      fonts:
        - asset: assets/fonts/Manrope-Variable.ttf
