# Sinov uchun Android APK. `build/apk` tarmog'iga push qilinganda quriladi va
# Releases → «apk-test» → MAB.apk (va Actions → Artifacts) sifatida chiqadi.
# Reliz kaliti yo'q bo'lsa, APK debug kalit bilan imzolanadi — telefonga
# o'rnatib sinash uchun yetarli, Play'ga yuklash uchun emas (u .aab va reliz
# kalitini talab qiladi, docs/GOOGLE-PLAY.md).
name: apk

on:
  push:
    branches: ['build/apk', 'build/apk-*']

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter pub get
      - run: flutter build apk --release
      - uses: actions/upload-artifact@v4
        with:
          name: mab-apk
          path: app/build/app/outputs/flutter-apk/app-release.apk
          retention-days: 7
      # Telefondan to'g'ridan-to'g'ri yuklab olish uchun: «apk-test»
      # pre-release'iga MAB.apk bo'lib qo'yiladi (har safar yangilanadi).
      - name: Release'ga qo'yish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp build/app/outputs/flutter-apk/app-release.apk MAB.apk
          gh release view apk-test >/dev/null 2>&1 || gh release create apk-test \
            --prerelease --target "$GITHUB_SHA" --title "MAB — sinov APK" \
            --notes "Telefonga o'rnatib sinash uchun. Play'ga yuklanmaydi."
          gh release upload apk-test MAB.apk --clobber
