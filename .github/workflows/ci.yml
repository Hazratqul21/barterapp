name: CI

on:
  push:
    branches: [develop, main]
  pull_request:
    branches: [develop, main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  api:
    name: api
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: api
    services:
      db:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: barter
          POSTGRES_PASSWORD: barter
          POSTGRES_DB: barter
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U barter -d barter"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 20
    env:
      # Faqat CI uchun soxta qiymatlar - haqiqiy sirlar emas.
      DATABASE_URL: postgresql+asyncpg://barter:barter@localhost:5432/barter
      JWT_SECRET: ci-only-not-a-secret-ci-only-not-a-secret-123456
      OTP_DEBUG: "true"
      SMS_REQUIRED: "false"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: api/requirements.txt
      # tests/run_all.sh .venv/bin/python ni ishlatadi
      - name: Install dependencies
        run: |
          python -m venv .venv
          .venv/bin/pip install -r requirements.txt
      - name: Alembic migrations
        run: .venv/bin/alembic upgrade head
      - name: Seed database
        run: .venv/bin/python -m app.seed
      - name: Start API (port 8010)
        run: |
          nohup .venv/bin/uvicorn app.main:app --host 127.0.0.1 --port 8010 > uvicorn.log 2>&1 &
          for i in $(seq 1 30); do
            if curl -s -o /dev/null http://127.0.0.1:8010/docs; then
              echo "API is up"; exit 0
            fi
            sleep 1
          done
          echo "API did not start"; cat uvicorn.log; exit 1
      - name: API tests
        run: ./tests/run_all.sh
      - name: Show API log on failure
        if: failure()
        run: cat uvicorn.log || true

  app:
    name: app
    runs-on: ubuntu-latest
    timeout-minutes: 25
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter --version
      - run: flutter pub get
      - run: flutter analyze
      - run: flutter test

  ai_backend:
    name: ai_backend
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: ai_backend
    steps:
      - uses: actions/checkout@v4
      - uses: dart-lang/setup-dart@v1
        with:
          sdk: stable
      - uses: actions/cache@v4
        with:
          path: ~/.pub-cache
          key: pub-${{ runner.os }}-${{ hashFiles('ai_backend/pubspec.lock') }}
          restore-keys: pub-${{ runner.os }}-
      - run: dart pub get
      - run: dart analyze
