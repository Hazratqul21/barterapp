# MAB: sayt (Flutter web) va API. certbot HTTPS'ni shu faylga o'zi qo'shadi.

map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

# API — https://__API_DOMAIN__ (admin panel: /admin, Payme: /payments/payme)
server {
    listen 80;
    listen [::]:80;
    server_name __API_DOMAIN__;

    # Surat chegarasi 12 MB; API o'zi 16 MB dan kattasini rad etadi.
    client_max_body_size 16m;

    location / {
        proxy_pass http://127.0.0.1:8010;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # Chat (WebSocket /ws).
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_read_timeout 120s;
    }
}

# Sayt — https://__DOMAIN__
server {
    listen 80;
    listen [::]:80;
    server_name __DOMAIN__ www.__DOMAIN__;

    root /var/www/mab;
    index index.html;

    # Android/iOS app-link fayllari (app/deeplinks/ dan, to'ldirilgach).
    location /.well-known/ {
        default_type application/json;
        try_files $uri =404;
    }

    # Flutter fayllari nomida versiya yo'q — keshni qisqa tutamiz.
    location ~* \.(js|css|wasm|json|png|jpg|jpeg|svg|ttf|otf|woff2?)$ {
        expires 1h;
        try_files $uri =404;
    }

    # Har qanday yo'l (/listing/…, /payments/return, /l/…) ilovaga qaytadi.
    location / {
        add_header Cache-Control "no-cache";
        try_files $uri $uri/ /index.html;
    }
}
