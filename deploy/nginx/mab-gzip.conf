# Siqish. Sayt va API server bloklari ichiga `include` qilinadi.
#
# nginx sukut bo'yicha faqat text/html ni siqadi: Flutter'ning main.dart.js
# (~4.5 MB) va canvaskit.wasm (~5.5 MB) siqilmasdan ketardi — birinchi
# ochilish shuning uchun sekin edi. Siqilganda ~3 MB bo'ladi.
#
# gzip_static: deploy.sh build paytida tayyorlab qo'ygan .gz nusxani beradi
# (har so'rovda protsessor siqmaydi). Nusxa bo'lmasa — oddiy gzip.
gzip on;
gzip_static on;
gzip_vary on;
gzip_proxied any;
gzip_comp_level 6;
gzip_min_length 1024;
gzip_types
    text/plain text/css text/javascript application/javascript
    application/json application/manifest+json application/wasm
    image/svg+xml font/ttf font/otf application/x-font-ttf;
