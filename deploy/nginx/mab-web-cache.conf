# Sayt fayllarining keshi. Sayt blokida `root` dan keyin include qilinadi —
# eski `location ~* \.(js|css|…)$` qoidasidan oldin turadi va undan ustun.

# Nomida mazmun heshi bor (deploy/web_prepare.sh): o'zgarmaydi, qayta so'ralmaydi.
# Qo'shtirnoq shart: regex ichida { } bor.
location ~ "^/(main\.dart\.[0-9a-f]{12}\.js|canvaskit\.[0-9a-f]{12}/.+)$" {
    add_header Cache-Control "public, max-age=31536000, immutable";
    include snippets/mab-web-headers.conf;
    try_files $uri =404;
}

# Shrift va suratlar: nomi o'zgarmaydi, shuning uchun qisqa kesh va keyin
# orqa fonda yangilash (ochilishni kutdirmaydi).
location ~ ^/(assets|icons)/.+\.(ttf|otf|woff2?|png|jpe?g|webp|svg)$ {
    add_header Cache-Control "public, max-age=3600, stale-while-revalidate=604800";
    include snippets/mab-web-headers.conf;
    try_files $uri =404;
}
