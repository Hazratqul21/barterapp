# Sayt (mab.uz) xavfsizlik sarlavhalari. Sayt blokida ham, `location /`
# ichida ham include qilinadi: nginx'da location o'zining add_header'i
# bo'lsa, server darajasidagilarni meros olmaydi.
#
# CSP: faqat o'zimiz va kerakli tashqi manbalar. Google — "Google bilan
# kirish" tugmasi; api.mab.uz — API va chat (wss); paycom.uz — to'lov
# sahifasiga o'tish. wasm-unsafe-eval — Flutter (CanvasKit) uchun shart.
add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'wasm-unsafe-eval' https://accounts.google.com/gsi/client; connect-src 'self' https://api.mab.uz wss://api.mab.uz https://accounts.google.com/gsi/ https://fonts.gstatic.com; img-src 'self' data: blob: https:; style-src 'self' 'unsafe-inline' https://accounts.google.com/gsi/style; font-src 'self' data: https://fonts.gstatic.com; frame-src https://accounts.google.com/gsi/; worker-src 'self' blob:; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" always;
add_header Strict-Transport-Security "max-age=31536000" always;
add_header X-Content-Type-Options "nosniff" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header Permissions-Policy "camera=(self), microphone=(), geolocation=(self), payment=()" always;
