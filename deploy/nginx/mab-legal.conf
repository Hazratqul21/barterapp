# Huquqiy hujjatlar: https://mab.uz/privacy, /terms, /offer, /delete-account
# va admin panelda qo'shilgan har qanday https://mab.uz/legal/<nom>.
# Matn API'dan keladi (admin paneldan tahrirlanadi), shuning uchun bu
# manzillar Flutter ilovasiga emas, API'ga yo'naltiriladi.
# Bu fayl mab.conf dagi sayt bloki ichiga `include` qilinadi.

location ~ ^/(privacy|terms|offer|delete-account)/?$ {
    proxy_pass http://127.0.0.1:8010/legal/$1$is_args$args;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
}

location ~ ^/legal/([a-z0-9-]+)/?$ {
    proxy_pass http://127.0.0.1:8010/legal/$1$is_args$args;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
}
