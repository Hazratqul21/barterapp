# MAB: nginx'ning umumiy (http) sozlamalari. /etc/nginx/conf.d/ ga qo'yiladi.

# Versiya xato sahifalari va sarlavhalarda ko'rsatilmasin.
server_tokens off;

# Noma'lum domen yoki to'g'ridan-to'g'ri IP bilan kelgan so'rovlar hech
# qaysi saytga tushmasin (aks holda birinchi blok — API — javob berardi).
server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _;
    return 444;
}
