services:
  db:
    image: postgres:16-alpine
    container_name: barter-db
    environment:
      POSTGRES_USER: barter
      POSTGRES_PASSWORD: barter
      POSTGRES_DB: barter
    # 5433 is taken by another project on this machine.
    ports:
      - "5434:5432"
    volumes:
      - barter-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U barter -d barter"]
      interval: 5s
      timeout: 3s
      retries: 20

volumes:
  barter-pgdata:
